---
# defaults file for roles/docker

docker_apt_keyring_path: /etc/apt/keyrings/docker.asc
docker_apt_repository: "deb [arch={{ docker_apt_architecture }} signed-by={{ docker_apt_keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-doc
  - podman-docker
  - containerd
  - runc
docker_service_name: docker
docker_users: []
