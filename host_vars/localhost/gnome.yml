---
gnome_settings_overrides:
  /org/gnome/shell/extensions/dash-to-dock/extend-height: "false"
  /org/gnome/shell/extensions/dash-to-dock/dock-position: "'BOTTOM'"
  /org/gnome/shell/extensions/dash-to-dock/show-mounts: "false"
  /org/gnome/shell/extensions/dash-to-dock/show-tash: "false"
  /org/gnome/shell/extensions/dash-to-dock/dock-fixed: "false"
  /org/gnome/shell/extensions/ding/show-home: "false"
  /org/gnome/desktop/input-sources/sources: "[('xkb', 'fr+azerty')]"
  /org/gnome/desktop/background/picture-uri: "'file:///{{ ansible_facts['user_dir'] }}/.local/share/backgrounds/wallhaven-yqelkd.jpg'"
  /org/gnome/desktop/background/picture-uri-dark: "'file:///{{ ansible_facts['user_dir'] }}/.local/share/backgrounds/wallhaven-yqelkd.jpg'"
  /org/gnome/desktop/interface/color-scheme: "'prefer-dark'"
  /org/gnome/desktop/interface/gtk-theme: "'Yaru-blue-dark'"
  /org/gnome/desktop/interface/icon-theme: "'Yaru-blue-dark'"
  /org/gnome/shell/favorite-apps: "['firefox_firefox.desktop', 'org.gnome.Nautilus.desktop', 'kitty.desktop', 'org.keepassxc.KeePassXC.desktop', 'com.github.IsmaelMartinez.teams_for_linux.desktop', 'org.logseq.Logseq.desktop', 'org.gnome.Settings.desktop']"
